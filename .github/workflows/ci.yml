name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    # RelayFlow is net8.0 ASP.NET Core, cross-platform.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RelayFlow.slnx

      - name: Build
        run: dotnet build RelayFlow.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/RelayFlow.Tests/RelayFlow.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/RelayFlow/RelayFlow.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
